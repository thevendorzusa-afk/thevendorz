<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get a Quote — Deluxe Goodie Bag | The Vendorz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
   (function(){
      emailjs.init("YOUR_PUBLIC_KEY");
   })();
</script>
<style>
  :root{
    --deluxe-bg: #221226;
    --deluxe-card: #2D1833;
    --deluxe-text: #FFF0F5;
    --candy-pink: #FF6B9D;
    --candy-mint: #5ECCC0;
    --candy-purple: #D946A6;
    --line: rgba(255,255,255,0.15);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--deluxe-bg);
    color:var(--deluxe-text);
    font-family:'Karla',sans-serif;
    padding: 32px 16px;
  }
  .wrap{
    max-width:650px;
    margin:0 auto;
    background:var(--deluxe-card);
    border:3px solid var(--candy-purple);
    border-radius:16px;
    padding:32px;
    box-shadow:0 12px 40px rgba(217,70,166,0.3);
  }
  h1{
    font-family:'Bricolage Grotesque',sans-serif;
    margin-top:0;
    background:linear-gradient(135deg, #FFF, var(--candy-pink));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .price-tag{
    font-family:'Space Mono',monospace;
    font-size:1.1rem;
    font-weight:700;
    color:var(--candy-mint);
    margin-bottom:16px;
  }
  .details-box{
    background:rgba(94,204,192,0.1);
    border-left:4px solid var(--candy-mint);
    padding:16px;
    border-radius:6px;
    margin-bottom:24px;
    font-size:0.9rem;
    line-height:1.5;
  }
  .toggle-group{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin:20px 0;
    background:rgba(0,0,0,0.2);
    padding:16px;
    border-radius:8px;
    border:1px solid var(--line);
  }
  .toggle-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'Space Mono',monospace;
    font-size:0.8rem;
    font-weight:700;
    text-transform:uppercase;
  }
  .switch{ position:relative; width:42px; height:24px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0;
    background-color:#555; transition:.3s; border-radius:24px;
  }
  .slider:before{
    position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px;
    background-color:white; transition:.3s; border-radius:50%;
  }
  input:checked + .slider{ background-color:var(--candy-mint); }
  input:checked + .slider:before{ transform:translateX(18px); }

  .form-group{ margin-bottom:16px; }
  .form-group label{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:0.75rem;
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:6px;
  }
  .form-group input, .form-group textarea{
    width:100%;
    padding:12px;
    border:2px solid var(--line);
    border-radius:8px;
    font-family:'Karla',sans-serif;
    font-size:1rem;
    background:rgba(255,255,255,0.08);
    color:#fff;
  }
  .btn{
    display:block;
    width:100%;
    padding:14px;
    background:linear-gradient(135deg, var(--candy-mint), var(--candy-pink));
    color:#111;
    border:none;
    border-radius:8px;
    font-family:'Space Mono',monospace;
    font-weight:800;
    font-size:0.9rem;
    text-transform:uppercase;
    cursor:pointer;
  }
  .back-link{
    display:inline-block;
    margin-bottom:16px;
    font-family:'Space Mono',monospace;
    font-size:0.75rem;
    color:var(--candy-mint);
    text-decoration:none;
  }
</style>
</head>
<body>

<div class="wrap">
  <a href="index.html" class="back-link">← Back to Collection</a>
  <h1>Request Quote: Deluxe VIP</h1>
  <div class="price-tag">$40 / bag • Order deadline: Tzom Gedaliah • MOQ: 50</div>

  <div class="details-box">
    <strong>Included in Bag:</strong> 2 specialty snacks, 3 snacks, 3 mini snacks, 1 drink, 4 branded candies, 1 small prize, 1 big prize, and a Custom Logo Drawstring Bag.
  </div>

  <form id="quoteForm" onsubmit="sendQuote(event)">
    <div class="toggle-group">
      <div class="toggle-item">
        <span>Include Custom Sponsor Card Inside</span>
        <label class="switch">
          <input type="checkbox" id="sponsorToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label>Quantity Needed (Min. 50)</label>
      <input type="number" id="amount" min="50" required placeholder="e.g. 100">
    </div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" required placeholder="Your Name">
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="phone" required placeholder="(555) 000-0000">
    </div>

    <div class="form-group">
      <label>Delivery Address</label>
      <textarea id="address" rows="3" required placeholder="Street Address, City, State, ZIP"></textarea>
    </div>

    <button type="submit" id="submitBtn" class="btn">Submit Quote Request</button>
  </form>
</div>

<script>
function sendQuote(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.innerText = 'Sending...';

  const params = {
    package: "Deluxe VIP ($40/bag)",
    amount: document.getElementById('amount').value,
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    address: document.getElementById('address').value,
    custom_sticker: "N/A (Includes Drawstring Bag)",
    sponsor_card: document.getElementById('sponsorToggle').checked ? "Yes" : "No"
  };

  emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', params)
    .then(() => {
      alert('Quote request sent successfully!');
      window.location.href = 'index.html';
    }, (error) => {
      alert('Failed to send request. ' + JSON.stringify(error));
      btn.innerText = 'Submit Quote Request';
    });
}
</script>

</body>
</html>
