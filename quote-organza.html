<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get a Quote — Organza Bag | The Vendorz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
   (function(){
      emailjs.init("YOUR_PUBLIC_KEY");
   })();
</script>
<style>
  :root{
    --kraft: #EDE1BE;
    --card: #F9F2DE;
    --ink: #382A1F;
    --candy-pink: #FF6B9D;
    --candy-purple: #D946A6;
    --muted: #8A7860;
    --line: rgba(56,42,31,0.22);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--kraft);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    padding: 32px 16px;
  }
  .wrap{
    max-width:650px;
    margin:0 auto;
    background:var(--card);
    border:3px solid var(--candy-pink);
    border-radius:16px;
    padding:32px;
    box-shadow:0 8px 24px rgba(0,0,0,0.08);
  }
  h1{
    font-family:'Bricolage Grotesque',sans-serif;
    margin-top:0;
  }
  .price-tag{
    font-family:'Space Mono',monospace;
    font-size:1.1rem;
    font-weight:700;
    color:var(--candy-pink);
    margin-bottom:16px;
  }
  .details-box{
    background:rgba(255,107,157,0.08);
    border-left:4px solid var(--candy-pink);
    padding:16px;
    border-radius:6px;
    margin-bottom:24px;
    font-size:0.9rem;
  }
  .toggle-group{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin:20px 0;
    background:#fff;
    padding:16px;
    border-radius:8px;
    border:1px solid var(--line);
  }
  .toggle-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'Space Mono',monospace;
    font-size:0.8rem;
    font-weight:700;
    text-transform:uppercase;
  }
  .switch{ position:relative; width:42px; height:24px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0;
    background-color:#ccc; transition:.3s; border-radius:24px;
  }
  .slider:before{
    position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px;
    background-color:white; transition:.3s; border-radius:50%;
  }
  input:checked + .slider{ background-color:var(--candy-pink); }
  input:checked + .slider:before{ transform:translateX(18px); }

  .form-group{ margin-bottom:16px; }
  .form-group label{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:0.75rem;
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:6px;
  }
  .form-group input, .form-group textarea{
    width:100%;
    padding:12px;
    border:2px solid var(--line);
    border-radius:8px;
    font-family:'Karla',sans-serif;
    font-size:1rem;
  }
  .btn{
    display:block;
    width:100%;
    padding:14px;
    background:linear-gradient(135deg, var(--candy-pink), var(--candy-purple));
    color:white;
    border:none;
    border-radius:8px;
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:0.9rem;
    text-transform:uppercase;
    cursor:pointer;
  }
  .back-link{
    display:inline-block;
    margin-bottom:16px;
    font-family:'Space Mono',monospace;
    font-size:0.75rem;
    color:var(--muted);
    text-decoration:none;
  }
</style>
</head>
<body>

<div class="wrap">
  <a href="index.html" class="back-link">← Back to Collection</a>
  <h1>Request Quote: Organza Bag</h1>
  <div class="price-tag">From $1 / bag • MOQ: 50</div>

  <div class="details-box">
    <strong>Included:</strong> Handful of treats in an organza bag. Perfect for smaller groups or special requests.
  </div>

  <form id="quoteForm" onsubmit="sendQuote(event)">
    <div class="toggle-group">
      <div class="toggle-item">
        <span>Add Sponsor Tag / Card</span>
        <label class="switch">
          <input type="checkbox" id="sponsorToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label>Quantity Needed (Min. 50)</label>
      <input type="number" id="amount" min="50" required placeholder="e.g. 100">
    </div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" required placeholder="Your Name">
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="phone" required placeholder="(555) 000-0000">
    </div>

    <div class="form-group">
      <label>Delivery Address</label>
      <textarea id="address" rows="3" required placeholder="Street Address, City, State, ZIP"></textarea>
    </div>

    <button type="submit" id="submitBtn" class="btn">Submit Quote Request</button>
  </form>
</div>

<script>
function sendQuote(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.innerText = 'Sending...';

  const params = {
    package: "Organza Bag (From $1/bag)",
    amount: document.getElementById('amount').value,
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    address: document.getElementById('address').value,
    custom_sticker: "N/A",
    sponsor_card: document.getElementById('sponsorToggle').checked ? "Yes" : "No"
  };

  emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', params)
    .then(() => {
      alert('Quote request sent successfully!');
      window.location.href = 'index.html';
    }, (error) => {
      alert('Failed to send request. ' + JSON.stringify(error));
      btn.innerText = 'Submit Quote Request';
    });
}
</script>

</body>
</html>
