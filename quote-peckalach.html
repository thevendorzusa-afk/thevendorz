\<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Request — Peckalach Bag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --kraft: #EDE1BE; --ink: #382A1F; --berry: #8C2F39;
    --candy-pink: #FF6B9D; --candy-purple: #D946A6; --muted: #8A7860;
    --line: rgba(56,42,31,0.22);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--kraft); color: var(--ink); font-family: 'Karla', sans-serif; }
  html { scroll-behavior: smooth; }
  .mono{ font-family:'Space Mono',monospace; letter-spacing:0.02em; }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  a { color: inherit; }

  .promo-banner{
    background:linear-gradient(90deg, var(--candy-pink) 0%, var(--candy-purple) 50%, #5ECCC0 100%);
    color:white;
    padding:16px 32px;
    text-align:center;
    font-weight:700;
    font-family:'Space Mono',monospace;
    font-size:0.9rem;
    text-transform:uppercase;
    position:relative;
    overflow:hidden;
    z-index:100;
  }

  .promo-banner::before{
    content:"🎉 10% OFF all orders placed before Rosh Hashana 🎉  •  🎉 10% OFF all orders placed before Rosh Hashana 🎉  •  🎉 10% OFF all orders placed before Rosh Hashana 🎉";
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    white-space:nowrap;
    animation:scroll-banner 20s linear infinite;
  }

  @keyframes scroll-banner {
    0% { transform:translateX(0) translateY(-50%); }
    100% { transform:translateX(-33.33%) translateY(-50%); }
  }

  .promo-banner::after{
    content:"";
    position:absolute;
    top:0;
    right:0;
    width:100px;
    height:100%;
    background:linear-gradient(90deg, transparent, var(--candy-pink), var(--candy-purple), #5ECCC0);
    pointer-events:none;
  }

  .main-content { padding: 40px 20px; min-height: calc(100vh - 200px); }
  .form-card { max-width: 600px; margin: 0 auto; background: #FFFBF2; border: 3px solid var(--candy-pink); border-radius: 16px; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
  .back-link { display: inline-block; margin-bottom: 20px; font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--muted); text-decoration: none; transition: color .15s ease; }
  .back-link:hover { color: var(--candy-pink); }
  .field { margin-bottom: 20px; }
  label { display: block; font-family: 'Space Mono', monospace; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 6px; font-weight: 700; }
  input, textarea { width: 100%; padding: 12px; border: 2px solid var(--muted); border-radius: 8px; font-family: inherit; font-size: 1rem; transition: all .2s ease; }
  input:focus, textarea:focus { outline: none; border-color: var(--candy-pink); box-shadow: 0 0 0 3px rgba(255,107,157,0.1); }
  
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 24px;
    width: 100%;
    font-family: 'Space Mono', monospace;
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-decoration: none;
    border-radius: 8px;
    transition: all .2s ease;
    font-weight: 700;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--candy-pink), var(--candy-purple));
    color: white;
    box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
  }
  .btn-primary:active { transform: scale(0.97); }

  footer{
    padding:28px 32px;
    display:flex;
    justify-space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    font-family:'Space Mono',monospace;
    font-size:0.7rem;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
    border-top:3px solid var(--berry);
    background:linear-gradient(90deg, rgba(255,107,157,0.05), rgba(164,214,94,0.05));
  }
  .footer-contact{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    align-items:center;
  }
  .footer-contact a{
    text-decoration:none;
    transition:all .15s ease;
    color:var(--muted);
  }
  .footer-contact a:hover{
    color:var(--candy-pink);
    font-weight:700;
  }

  .social-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:all .15s ease;
  }

  .social-logo{
    width:18px;
    height:18px;
    display:block;
  }

  .social-link:hover .social-logo{
    transform:scale(1.2);
  }
</style>
</head>
<body>

<div class="promo-banner"></div>

<div class="main-content">
  <div class="form-card">
    <a href="bags.html" class="back-link">← Back to Collection</a>
    <h1>Request Quote: Peckalach Bag</h1>
    <p>Base Price: $10 / bag • MOQ: 50</p>
    
    <form id="quote-form">
      <div class="field">
        <label for="user_name">Full Name *</label>
        <input type="text" id="user_name" required>
      </div>
      
      <div class="field">
        <label for="user_email">Email Address *</label>
        <input type="email" id="user_email" required>
      </div>

      <div class="field">
        <label for="user_phone">Phone Number *</label>
        <input type="tel" id="user_phone" required>
      </div>

      <div class="field">
        <label for="user_address">Shipping Address *</label>
        <input type="text" id="user_address" required>
      </div>

      <div class="field">
        <label for="shul_name">Shul / Organization Name *</label>
        <input type="text" id="shul_name" required>
      </div>

      <div class="field">
        <label for="quantity">Quantity Needed (Min 50) *</label>
        <input type="number" id="quantity" min="50" value="50" required>
      </div>

      <div class="field">
        <label for="notes">Notes / Special Requests</label>
        <textarea id="notes" rows="3"></textarea>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">Submit Quote Request</button>
    </form>
  </div>
</div>

<footer>
  <div>© 2026 The Vendorz</div>
  <div class="footer-contact">
    <a href="tel:+16467701541">(646) 770-1541</a>
    <span style="color:var(--line);">—</span>
    <a href="https://wa.me/16467701541" class="social-link" target="_blank">
      <svg class="social-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="11" fill="#25D366"/>
        <path fill="white" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
      </svg>
      <span>WhatsApp</span>
    </a>
    <span style="color:var(--line);">—</span>
    <a href="https://instagram.com/thevendorz" class="social-link" target="_blank">
      <svg class="social-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#E1306C">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.057-1.645.069-4.849.069-3.204 0-3.584-.012-4.849-.069-3.259-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zM5.838 12a6.162 6.162 0 1 1 12.324 0 6.162 6.162 0 0 1-12.324 0zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm4.965-10.322a1.44 1.44 0 1 1 2.881.001 1.44 1.44 0 0 1-2.881-.001z"/>
      </svg>
      <span>@thevendorz</span>
    </a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
  (function(){
    emailjs.init("S9GBrLHFP_VYD68RT");
  })();

  document.getElementById('quote-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    if (btn) { btn.disabled = true; btn.innerText = 'Sending...'; }

    const randomQuoteId = 'Q-' + Math.floor(100000 + Math.random() * 900000);
    const qty = parseInt(document.getElementById('quantity').value) || 50;
    const subtotal = qty * 10;
    const discount = subtotal * 0.10;
    const total = subtotal - discount;

    const params = {
      quote_id: randomQuoteId,
      package_name: 'Peckalach Goodie Bag',
      is_pecalach: true,
      is_classic: false,
      is_deluxe: false,
      base_price: '$10 / bag',
      quantity: qty,
      subtotal: '$' + subtotal.toFixed(2),
      discount_amount: '-$' + discount.toFixed(2),
      estimated_total: '$' + total.toFixed(2),
      from_name: document.getElementById('user_name').value,
      reply_to: document.getElementById('user_email').value,
      phone: document.getElementById('user_phone').value,
      address: document.getElementById('user_address').value,
      shul_name: document.getElementById('shul_name').value,
      notes: document.getElementById('notes').value || 'None'
    };

    emailjs.send('service_ljmyd45', 'template_2cadmvf', params)
      .then(function() {
        alert('Quote request sent! Your quote ID is #' + randomQuoteId);
        if (btn) { btn.disabled = false; btn.innerText = 'Submit Quote Request'; }
      })
      .catch(function(error) {
        alert('Failed to send request: ' + (error.text || JSON.stringify(error)));
        if (btn) { btn.disabled = false; btn.innerText = 'Submit Quote Request'; }
      });
  });
</script>
</body>
</html>
