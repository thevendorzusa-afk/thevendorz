<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vendorz — This Year's Bags</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft: #EDE1BE;
    --card: #F9F2DE;
    --ink: #382A1F;
    --berry: #8C2F39;
    --mustard: #C98A2C;
    --candy-pink: #FF6B9D;
    --candy-lime: #A4D65E;
    --candy-mint: #5ECCC0;
    --candy-purple: #D946A6;
    --deluxe-bg: #221226;
    --deluxe-card: #2D1833;
    --deluxe-text: #FFF0F5;
    --muted: #8A7860;
    --line: rgba(56,42,31,0.22);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--kraft);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }

  h1,h2,h3,.display{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .mono{
    font-family:'Space Mono',monospace;
    letter-spacing:0.02em;
  }
  a{color:inherit;}
  .wrap{
    max-width:1120px;
    margin:0 auto;
    padding:0 32px;
  }

  header{
    position:sticky;
    top:0;
    z-index:100;
    background:var(--kraft);
    border-bottom:3px solid var(--berry);
    box-shadow:0 2px 8px rgba(56,42,31,0.06);
  }
  .header-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 32px;
    max-width:1120px;
    margin:0 auto;
  }
  .logo-slot{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
  }
  .logo-placeholder{
    width:38px;
    height:26px;
    background:linear-gradient(135deg, var(--mustard) 0%, var(--candy-pink) 100%);
    border-radius:2px 9px 2px 2px;
    transform:rotate(-6deg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Mono',monospace;
    font-size:0.45rem;
    color:white;
    text-transform:uppercase;
    flex-shrink:0;
    position:relative;
    box-shadow:0 4px 12px rgba(255, 107, 157, 0.3);
  }
  .logo-placeholder::after{
    content:"";
    position:absolute;
    left:6px;
    top:50%;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    transform:translateY(-50%);
    box-shadow:0 0 0 1px var(--ink);
  }
  .brand{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800;
    font-size:1.25rem;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand .mark{
    background:linear-gradient(135deg, var(--candy-pink) 0%, var(--candy-purple) 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  nav.tabs{
    display:flex;
    gap:2px;
  }
  nav.tabs a{
    font-family:'Space Mono',monospace;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    text-decoration:none;
    color:var(--muted);
    padding:10px 14px;
    transition:color .15s ease;
    border-radius:3px;
  }
  nav.tabs a:hover{
    color:var(--candy-pink);
    background:rgba(255,107,157,0.1);
  }
  @media (max-width:720px){
    nav.tabs{display:none;}
  }

  .page-hero{
    padding:64px 32px 48px;
    border-bottom:2px dashed var(--candy-lime);
    position:relative;
    z-index:2;
  }
  .page-hero .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    background:linear-gradient(135deg, var(--candy-pink), var(--candy-purple));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:20px;
    font-weight:700;
  }
  .page-hero h1{
    font-size:clamp(2.1rem, 4.2vw, 3.1rem);
    line-height:1.08;
    margin:0 0 16px;
    max-width:18ch;
  }
  .page-hero p{
    font-size:1.02rem;
    line-height:1.6;
    color:var(--ink);
    max-width:52ch;
    margin:0;
    font-weight:600;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Space Mono',monospace;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--muted);
    text-decoration:none;
    margin-bottom:24px;
    transition:color .15s ease;
  }
  .back-link:hover{ color:var(--candy-pink); }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 24px;
    font-family:'Space Mono',monospace;
    font-size:0.76rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    text-decoration:none;
    border-radius:8px;
    transition:all .2s ease;
    font-weight:700;
    width:100%;
  }
  .btn-primary{
    background:linear-gradient(135deg, var(--candy-pink) 0%, var(--candy-purple) 100%);
    color:white;
    border:2px solid transparent;
    box-shadow:0 4px 12px rgba(255, 107, 157, 0.3);
  }
  .btn-primary:hover{ 
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(255, 107, 157, 0.4);
  }
  .btn-primary:active{ transform:scale(0.97); }
  .btn-ghost{
    color:var(--ink);
    border:2px solid var(--candy-pink);
    background:transparent;
  }
  .btn-ghost:hover{ 
    background:var(--candy-pink);
    color:white;
    transform:translateY(-2px);
  }

  .section{
    padding:72px 32px;
    border-bottom:2px dashed var(--line);
    position:relative;
    z-index:2;
  }
  .section-head{
    margin-bottom:48px;
  }
  .section-head h2{
    font-size:clamp(1.7rem,3vw,2.4rem);
    margin:0;
  }
  .section-eyebrow{
    font-family:'Space Mono',monospace;
    font-size:0.72rem;
    background:linear-gradient(135deg, var(--candy-pink), var(--candy-purple));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:10px;
    display:block;
    font-weight:700;
  }
  .section-desc{
    color:var(--ink);
    max-width:52ch;
    line-height:1.6;
    margin-top:12px;
    font-weight:600;
  }

  .tiers{
    display:flex;
    flex-direction:column;
    gap:24px;
  }
  
  .tier{
    border-radius:16px;
    padding:24px;
    position:relative;
    display:flex;
    align-items:stretch;
    gap:24px;
    transition:all .3s ease;
  }

  .tier-peckalach{
    background:rgba(249,242,222,0.96);
    border:2px solid var(--line);
    box-shadow:0 6px 18px rgba(56,42,31,0.08);
  }
  .tier-peckalach::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:6px;
    background:var(--mustard);
    border-radius:16px 16px 0 0;
